name: Skill CI

on:
  push:
    branches: [beta, main, master]
  pull_request:
    branches: [beta, main, master]

jobs:
  python-tests:
    name: Lambda tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r lambda/requirements.txt

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('lambda/lambda_function.py').read()); print('OK')"

      - name: Run pytest
        run: |
          if [ -d lambda/test ] && [ -n "$(ls -A lambda/test 2>/dev/null | grep -v '^$')" ]; then
            python -m pytest lambda/test/ -v --tb=short
          else
            echo "No tests yet — skipping"
          fi

  json-validate:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in skill.json accountLinking.json; do
            [ -f "$f" ] || continue
            python -m json.tool "$f" > /dev/null && echo "✓ $f" || { echo "✗ $f"; exit 1; }
          done

  manifest-check:
    name: Skill manifest sanity (SmartHome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill manifest
        run: |
          python -c "
          import json
          m = json.load(open('skill.json'))
          assert 'manifest' in m, 'manifest key missing'
          assert m['manifest'].get('apis', {}).get('smartHome'), 'smartHome API not declared'
          assert m['manifest'].get('publishingInformation'), 'publishingInformation missing'
          assert m['manifest'].get('events'), 'events block missing (required for SmartHome)'
          print('manifest OK')
          "

      - name: Check accountLinking manifest
        run: |
          python -c "
          import json
          al = json.load(open('accountLinking.json'))
          req = al.get('accountLinkingRequest', {})
          assert req.get('type') == 'AUTH_CODE', 'AUTH_CODE required'
          assert 'authorizationUrl' in req, 'authorizationUrl missing'
          assert 'accessTokenUrl' in req, 'accessTokenUrl missing'
          print('accountLinking OK')
          "
